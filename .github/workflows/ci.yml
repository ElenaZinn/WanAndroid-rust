name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    name: Rust format, lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace

  android-source:
    name: Android source boundary check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assert hand-written Kotlin owns no networking stack
        run: |
          if grep -R -n -i -E 'retrofit|okhttp|wanandroid\.com|https?://' android/app/src/main/java/com; then
            echo "Hand-written Kotlin must not own transport, endpoints or DTO parsing." >&2
            exit 1
          fi
      - name: Assert generated UniFFI binding stays generated
        run: |
          test -f android/app/src/main/java/uniffi/wanandroid/wanandroid.kt
          grep -q 'autogenerated by' android/app/src/main/java/uniffi/wanandroid/wanandroid.kt
      - name: Assert Gradle project descriptors exist
        run: test -f android/settings.gradle.kts && test -f android/app/build.gradle.kts
